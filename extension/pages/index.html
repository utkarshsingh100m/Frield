<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frield — AI Cybersecurity Platform</title>
  <meta name="description" content="Frield protects your inbox and browser from phishing, malware, and cyber threats using AI-powered threat detection." />
  <meta name="theme-color" content="#0D1117" />
  <link rel="stylesheet" href="../css/styles.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    .particles { position:absolute;inset:0;overflow:hidden;pointer-events:none; }
    .particle { position:absolute;width:2px;height:2px;background:var(--neon);border-radius:50%;opacity:0;animation:particleFade var(--dur,4s) var(--delay,0s) ease-in-out infinite; }
    @keyframes particleFade { 0%{opacity:0;transform:translateY(0) scale(1)} 50%{opacity:.6} 100%{opacity:0;transform:translateY(-80px) scale(0)} }
    .scan-line { position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--neon),transparent);animation:scanLine 4s linear infinite;opacity:.4;pointer-events:none; }
    @keyframes scanLine { 0%{top:0} 100%{top:100%} }
    .typing-text::after { content:"|";animation:blink 1s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  </style>
</head>
<body>
  <div class="login-page cyber-grid">
    <div class="login-bg"></div>
    <div class="particles" id="particles"></div>
    <div class="scan-line"></div>

    <div class="login-card">
      <div class="login-logo" id="logoText">FRIELD</div>
      <p style="font-size:12px;color:var(--neon);margin-bottom:8px;font-family:'JetBrains Mono',monospace;">
        <span class="typing-text" id="typingText">AI Threat Detection</span>
      </p>
      <p class="login-tagline">Protect your inbox &amp; browser from cyber threats</p>

      <!-- Google Identity Services -->
      <div id="g_id_onload"
           data-client_id="YOUR_GOOGLE_CLIENT_ID"
           data-context="signin"
           data-ux_mode="popup"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin"
           data-type="standard"
           data-shape="rectangular"
           data-theme="filled_black"
           data-text="signin_with"
           data-size="large"
           data-width="100%"
           data-logo_alignment="left">
      </div>

      <!-- Features Grid -->
      <div class="features-grid" style="margin-top:28px">
        <div class="feature-item"><span class="fi-icon">📧</span><div class="fi-text"><strong>Email Scan</strong>AI-powered phishing detection</div></div>
        <div class="feature-item"><span class="fi-icon">🧠</span><div class="fi-text"><strong>ML Scoring</strong>0–100 threat assessment</div></div>
        <div class="feature-item"><span class="fi-icon">🔗</span><div class="fi-text"><strong>Hash Chain</strong>Blockchain file integrity</div></div>
        <div class="feature-item"><span class="fi-icon">🌐</span><div class="fi-text"><strong>Browser Guard</strong>URL threat monitoring</div></div>
      </div>

      <p style="font-size:11px;color:var(--text-muted);margin-top:20px;line-height:1.5;">
        By signing in you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
      </p>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="../js/api.js"></script>
  <script>
    // Particle Effect
    const particleContainer = document.getElementById("particles");
    for (let i = 0; i < 30; i++) {
      const p = document.createElement("div");
      p.className = "particle";
      p.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${3+Math.random()*4}s;--delay:${Math.random()*4}s;opacity:0;`;
      particleContainer.appendChild(p);
    }

    // Typing Effect
    const phrases = ["AI Threat Detection","Email Security","Browser Protection","Blockchain Vault"];
    let phraseIndex = 0, charIndex = 0, deleting = false;
    const typingEl = document.getElementById("typingText");
    function typeLoop() {
      const phrase = phrases[phraseIndex];
      if (!deleting) {
        typingEl.textContent = phrase.substring(0, ++charIndex);
        if (charIndex === phrase.length) { deleting = true; setTimeout(typeLoop, 1800); return; }
      } else {
        typingEl.textContent = phrase.substring(0, --charIndex);
        if (charIndex === 0) { deleting = false; phraseIndex = (phraseIndex + 1) % phrases.length; }
      }
      setTimeout(typeLoop, deleting ? 60 : 100);
    }
    typeLoop();

    // Auth Handlers
    async function handleCredentialResponse(response) {
      try {
        // Use raw fetch here since api.js initAuth hasn't run yet (login page)
        const res = await fetch('http://localhost:3000/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: response.credential })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        // Store in chrome.storage.local
        await chrome.storage.local.set({
          frield_token: data.token,
          frield_user: data.user
        });

        showToast("✅ Signed in as " + (data.user.name || data.user.email) + "!", "success");

        // Trigger sync non-blocking
        try {
          const syncRes = await fetch('http://localhost:3000/google/sync', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + data.token, 'Content-Type': 'application/json' }
          });
          if (syncRes.ok) showToast("✅ Emails synced & analyzed!", "success");
        } catch { /* Sync is non-critical */ }

        // Notify background to poll immediately
        chrome.runtime.sendMessage({ type: 'POLL_NOW' });

        setTimeout(() => {
          window.location.href = chrome.runtime.getURL('pages/dashboard.html');
        }, 1200);
      } catch (err) {
        showToast("❌ Login failed: " + err.message, "error");
      }
    }

    function showToast(msg, type = "info") {
      const tc = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.textContent = msg;
      tc.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    // Redirect if already logged in
    chrome.storage.local.get('frield_token', ({ frield_token }) => {
      if (frield_token) {
        window.location.href = chrome.runtime.getURL('pages/dashboard.html');
      }
    });
  </script>
</body>
</html>
